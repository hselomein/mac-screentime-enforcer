blueprint:
  name: Kid Mac Budget Enforcement
  description: >-
    Blocks one kid on every Mac once their screen time for today reaches
    their daily budget plus any bonus (capped at their max bonus), and
    unblocks them when it's back under after a parent raises the budget,
    grants bonus or turns Parent Override off. Minutes going up never
    unblocks, so a manual block holds until one of those (or the daily
    reset). Parent Override means unlimited: turning it on allows the kid
    right away and the budget is ignored until it's turned off. Does
    nothing until their Daily Budget has been set.

    Everything it needs is created automatically by the Macs. Each kid has
    a device named after them holding Total Minutes Today (summed across
    every Mac), Daily Budget, Bonus Minutes, Max Bonus Minutes and Parent
    Override.

    Import once, then create one automation per kid and rename it after
    saving (e.g. "screentime_cj Budget Enforcement").
  domain: automation
  source_url: https://raw.githubusercontent.com/hselomein/mac-screentime-enforcer/main/homeassistant/blueprints/kid_mac_budget_enforcement.yaml
  input:
    total_minutes_sensor:
      name: Total Minutes Today
      description: The kid's "Total Minutes Today" sensor (on the kid's own device, not a Mac's).
      selector:
        entity:
          domain: sensor
    daily_budget_entity:
      name: Daily Budget
      description: The kid's "Daily Budget" number.
      selector:
        entity:
          domain: number
    bonus_minutes_entity:
      name: Bonus Minutes
      description: The kid's "Bonus Minutes" number.
      selector:
        entity:
          domain: number
    max_bonus_entity:
      name: Max Bonus Minutes
      description: The kid's "Max Bonus Minutes" number (caps how much bonus counts).
      selector:
        entity:
          domain: number
    parent_override_switch:
      name: Parent Override
      description: >-
        The kid's "Parent Override" switch: unlimited time. Turning it on
        allows the kid right away, and while it's on the budget never
        blocks them.
      selector:
        entity:
          domain: switch
    allowed_topic:
      name: Allowed MQTT Topic
      description: >-
        The kid's topic_prefix plus "/allowed", e.g.
        screen/screentime_cj/allowed. The installer's setup checklist lists
        the exact value for each kid.
      selector:
        text: {}

variables:
  minutes_e: !input total_minutes_sensor
  budget_e: !input daily_budget_entity
  bonus_e: !input bonus_minutes_entity
  max_bonus_e: !input max_bonus_entity
  override_e: !input parent_override_switch

trigger:
  # Minutes ticking up can only ever block, never unblock: otherwise a
  # parent's manual "not allowed" gets flipped back on at the next minute
  # (seen for real with cj). Unblocking happens when a parent changes the
  # budget, bonus, max bonus or override, or at the daily reset.
  - platform: state
    entity_id: !input total_minutes_sensor
    id: minutes
  - platform: state
    entity_id: !input daily_budget_entity
  - platform: state
    entity_id: !input bonus_minutes_entity
  - platform: state
    entity_id: !input max_bonus_entity
  - platform: state
    entity_id: !input parent_override_switch
    id: override

condition:
  # While Parent Override is on, minutes ticking up do nothing at all.
  - condition: template
    value_template: "{{ not (is_state(override_e, 'on') and trigger.id == 'minutes') }}"
  # Without a real budget the math below would treat it as 0 and block the
  # kid immediately — do nothing until a parent has set one (override
  # still works without one).
  - condition: template
    value_template: "{{ is_state(override_e, 'on') or states(budget_e) | is_number }}"

action:
  - choose:
      # Parent Override = unlimited: allow, whatever the budget says.
      - conditions:
          - condition: template
            value_template: "{{ is_state(override_e, 'on') }}"
        sequence:
          - service: mqtt.publish
            data:
              topic: !input allowed_topic
              qos: 1
              retain: true
              payload: "1"
      # Same effective-budget formula the Macs use for their voice
      # announcements: base + min(bonus, max bonus). >= so reaching the
      # budget exactly blocks. Max bonus defaults to 60 like the daemon.
      - conditions:
          - condition: template
            value_template: >-
              {{ states(minutes_e) | float(0) >=
                 states(budget_e) | float(0)
                 + [states(bonus_e) | float(0), states(max_bonus_e) | float(60)] | min }}
        sequence:
          - service: mqtt.publish
            data:
              topic: !input allowed_topic
              qos: 1
              retain: true
              payload: "0"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id != 'minutes' }}"
        sequence:
          - service: mqtt.publish
            data:
              topic: !input allowed_topic
              qos: 1
              retain: true
              payload: "1"

mode: single
max_exceeded: silent
