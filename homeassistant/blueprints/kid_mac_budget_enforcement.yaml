blueprint:
  name: Kid Mac Budget Enforcement
  description: >-
    Publishes allowed=0/1 based on minutes vs daily budget for one managed
    kid's Mac, retained. Skips enforcement while that kid's Parent Override
    switch is on.

    Re-evaluates on BOTH the minutes sensor changing AND the daily budget
    number changing — not just minutes. That second trigger matters: without
    it, increasing a kid's budget while they're already locked out (and so
    no longer accruing minutes) would never re-publish `allowed`, since
    nothing would be left to trigger the automation. Confirmed as a real gap
    in an earlier example that only triggered on minutes; fixed here.

    Import this blueprint once, then create one automation per managed kid
    from it, pointing the inputs at that kid's own entities/topic.

    Only use this if each kid uses ONE Mac. The allowed topic is per kid,
    not per Mac, so separate instances for the same kid on different Macs
    overwrite each other instead of giving per-Mac budgets. For a kid on
    several Macs, use kid_mac_budget_enforcement_combined.yaml.

    Known limitations: Bonus Minutes aren't counted (it compares against
    the base budget only, though the root daemon announces base + bonus),
    and minutes exactly equal to the budget publish nothing until the next
    minute.
  domain: automation
  source_url: https://raw.githubusercontent.com/hselomein/mac-screentime-enforcer/main/homeassistant/blueprints/kid_mac_budget_enforcement.yaml
  input:
    automation_name:
      name: Automation Name
      description: >-
        Meant to name the created automation, but in testing HA ignored it
        and every instance still got the generic blueprint name. Rename
        each automation yourself after creating it (e.g. "Kid Mac Budget
        Enforcement — aaron").
      default: "Kid Mac Budget Enforcement"
      selector:
        text: {}
    minutes_sensor:
      name: Minutes Sensor
      description: >-
        The kid's "<child> Mac Minutes" sensor. Search the kid's name in
        the picker; don't guess the entity_id, HA builds it from the device
        name too (e.g. sensor.screentime_cj_mac_screentime_cj_mac_minutes).
      selector:
        entity:
          domain: sensor
    daily_budget_entity:
      name: Daily Budget Number
      description: >-
        The kid's "<child> Mac Daily Budget (min)" number entity, from the
        same Mac device as the minutes sensor.
      selector:
        entity:
          domain: number
    parent_override_switch:
      name: Parent Override Switch
      description: >-
        The kid's "<child> Mac Parent Override" switch — while on, this
        automation does nothing, letting a parent hold `allowed` at
        whatever they've manually set regardless of minutes/budget.
      selector:
        entity:
          domain: switch
    allowed_topic:
      name: Allowed MQTT Topic
      description: >-
        The MQTT topic to publish the allowed state to, matching that kid's
        topic_prefix in config.json plus "/allowed" (e.g.
        screen/screentime_cj/allowed when child_name is screentime_cj).
      selector:
        text: {}

alias: !input automation_name

trigger:
  - platform: state
    entity_id: !input minutes_sensor
  - platform: state
    entity_id: !input daily_budget_entity

condition:
  - condition: not
    conditions:
      - condition: state
        entity_id: !input parent_override_switch
        state: "on"

action:
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: !input minutes_sensor
            above: !input daily_budget_entity
        sequence:
          - service: mqtt.publish
            data:
              topic: !input allowed_topic
              qos: 1
              retain: true
              payload: "0"
      - conditions:
          - condition: numeric_state
            entity_id: !input minutes_sensor
            below: !input daily_budget_entity
        sequence:
          - service: mqtt.publish
            data:
              topic: !input allowed_topic
              qos: 1
              retain: true
              payload: "1"

mode: single
