blueprint:
  name: Kid Mac Daily Reset
  description: >-
    Resets one managed kid's Mac screen-time state each morning:
    re-allows access, clears Parent Override, and zeroes out Bonus
    Minutes.

    Deliberately does NOT touch the daily budget number itself — that's
    either left as a standing value you set once, or driven by a
    separate weekly-schedule automation if you're using one (e.g.
    different limits for weekdays vs weekends). Max Bonus Minutes is
    also left untouched here, since it's a standing policy setting, not
    a daily one — only the bonus actually GRANTED resets, not the cap on
    how much can ever apply.

    Import once, then create one automation per managed kid from it.
  domain: automation
  input:
    reset_time:
      name: Reset Time
      description: What time to run the daily reset.
      default: "03:00:00"
      selector:
        time: {}
    allowed_switch:
      name: Allowed Switch
      description: The kid's allowed switch (e.g. switch.cj_mac_cj_mac_allowed).
      selector:
        entity:
          domain: switch
    parent_override_switch:
      name: Parent Override Switch
      description: >-
        The kid's parent override switch (e.g.
        switch.cj_mac_cj_mac_parent_override).
      selector:
        entity:
          domain: switch
    bonus_minutes_entity:
      name: Bonus Minutes Number
      description: >-
        The kid's bonus minutes number entity (e.g.
        number.cj_mac_cj_mac_bonus_minutes) — reset to 0 here. Do NOT
        point this at Max Bonus Minutes; that one's a standing cap, not
        a daily value.
      selector:
        entity:
          domain: number

triggers:
  - trigger: time
    at: !input reset_time

actions:
  - action: switch.turn_on
    target:
      entity_id: !input allowed_switch
  - action: switch.turn_off
    target:
      entity_id: !input parent_override_switch
  - action: number.set_value
    target:
      entity_id: !input bonus_minutes_entity
    data:
      value: 0

mode: single
