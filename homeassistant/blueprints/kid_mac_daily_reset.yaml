blueprint:
  name: Kid Mac Daily Reset (all kids)
  description: >-
    Resets every managed kid's Mac screen-time state each morning in ONE
    automation: re-allows access, clears Parent Override, and zeroes out
    Bonus Minutes for each of them. This one is a single reset action
    applied identically to a list of entities, not per-kid conditional
    logic like the budget-enforcement blueprint — so unlike that one,
    you don't need a separate automation instance per kid. Import once,
    pick all your kids' entities in the three lists below, done.

    Deliberately does NOT touch the daily budget number itself — that's
    either left as a standing value you set once, or driven by a
    separate weekly-schedule automation if you're using one (e.g.
    different limits for weekdays vs weekends). Max Bonus Minutes is
    also left untouched here, since it's a standing policy setting, not
    a daily one — only the bonus actually GRANTED resets, not the cap on
    how much can ever apply.
  domain: automation
  source_url: https://raw.githubusercontent.com/hselomein/mac-screentime-enforcer/main/homeassistant/blueprints/kid_mac_daily_reset.yaml
  input:
    reset_time:
      name: Reset Time
      description: What time to run the daily reset, for every kid at once.
      default: "03:00:00"
      selector:
        time: {}
    allowed_switches:
      name: Allowed Switches
      description: >-
        Every "<child> Mac Allowed" switch — every kid, on every Mac (one
        per kid per Mac). Search the kid's name in the picker; don't guess
        the entity_ids, HA builds them from the device name too.
      selector:
        entity:
          domain: switch
          multiple: true
    parent_override_switches:
      name: Parent Override Switches
      description: >-
        Every "<child> Mac Parent Override" switch — every kid, on every Mac.
      selector:
        entity:
          domain: switch
          multiple: true
    bonus_minutes_entities:
      name: Bonus Minutes Numbers
      description: >-
        Every "<child> Mac Bonus Minutes" number — every kid, on every Mac
        — each one reset to 0 here. Do NOT include any Max Bonus Minutes
        entity in this list; that one's a standing cap, not a daily
        value, and this blueprint never touches it.
      selector:
        entity:
          domain: number
          multiple: true

trigger:
  - platform: time
    at: !input reset_time

action:
  - service: switch.turn_on
    target:
      entity_id: !input allowed_switches
  - service: switch.turn_off
    target:
      entity_id: !input parent_override_switches
  - service: number.set_value
    target:
      entity_id: !input bonus_minutes_entities
    data:
      value: 0

mode: single
