# Home Assistant notes for this project.
#
# There is deliberately no mqtt:/input_number:/input_boolean:/template:
# YAML below. The root daemon (root-daemon/root_daemon_skeleton.py)
# publishes MQTT discovery for every entity it needs the moment it
# connects, so nothing has to be defined by hand. Two kinds of device
# appear under Settings -> Devices & Services -> MQTT:
#
# One device PER KID, named after the kid (e.g. "screentime_cj"). Every Mac
# managing that kid publishes it identically, so HA shows exactly one:
#   <child> Allowed               switch (parent-settable; drives lock/unlock)
#   <child> Daily Budget          number (parent-settable, minutes)
#   <child> Bonus Minutes         number (parent-settable, minutes)
#   <child> Max Bonus Minutes     number (parent-settable; caps counted bonus)
#   <child> Parent Override       switch (parent-settable)
#   <child> Total Minutes Today   sensor (summed across every Mac, by the Macs)
# Entity ids are predictable: number.<child>_daily_budget,
# sensor.<child>_total_minutes_today, switch.<child>_allowed, ...
#
# One device PER KID PER MAC, named "<child> mac (<friendly name or
# device_id>)", for things that really are per machine:
#   Minutes         sensor (this Mac only)
#   Active          binary_sensor
#   Online          binary_sensor
#   Session State   sensor (active/locked/backgrounded/offline)
#
# Defining your own versions of any of these here creates a SEPARATE set of
# entities the daemon never reads from or writes to — editing them does
# nothing.
#
# What you DO add by hand is two automations, from the blueprints in
# ./blueprints/ (import them, don't hand-write them):
#   - kid_mac_budget_enforcement.yaml — ONE automation PER KID. Blocks the
#     kid on every Mac once Total Minutes Today reaches Daily Budget +
#     min(Bonus Minutes, Max Bonus Minutes); unblocks when back under.
#   - kid_mac_daily_reset.yaml — ONE automation total, covering every kid.
#
# The installer prints the exact steps with your kids' names filled in and
# saves them to /Library/Application Support/ha-screen-agent/ha_setup_checklist.txt.
# See the main README's "Home Assistant integration" section for more, and
# config/CONFIG_REFERENCE.md for every config.json field on the Mac side.
#
# The old per-user agent (screentime_enforcer.py) still uses its original
# per-Mac entities ("<child> Mac Minutes", "<child> Mac Daily Budget (min)",
# ...); the blueprints above are for the root daemon only.
